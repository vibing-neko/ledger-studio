<!doctype html>
<html lang="zh-Hant-TW">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Ledger Studio — 股票損益、兩平價、投資報酬率與信用卡記帳的個人理財工具。" />
	<meta name="theme-color" content="#0c0d0b" />
	<script>
		// 先套用儲存的配色，避免載入時閃一下
		try {
			var t = localStorage.getItem('ledger-studio:theme')
			if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
		} catch (e) {}
	</script>
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet" />
	<title>Ledger Studio</title>
</head>
<body>
	<div id="app"></div>
	<script type="module" src="/src/main.js"></script>
</body>
</html>
